name: PsicoPanel CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Every edited event is isolated before routing, including ambiguous payloads.
  # Text cannot cancel a useful validation; real synchronize events still can.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' && github.event.action == 'edited') && github.run_id || 'validation' }}
  cancel-in-progress: true
jobs:
  route:
    name: metadata/route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      namespace: ${{ steps.route.outputs.namespace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: route
        run: python3 scripts/ci/events.py
  checks:
    name: ${{ needs.route.outputs.namespace || 'ci' }}/${{ matrix.component }}
    needs: [route]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        component: [docs, backend-unit, frontend, postgres, browser]
    steps:
      - name: Require successful event routing
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          CI_NAMESPACE: ${{ needs.route.outputs.namespace }}
        run: python3 -c "import os; assert os.environ['ROUTE_RESULT'] == 'success' and os.environ['CI_NAMESPACE'] in ('ci', 'metadata')"
      - name: Acknowledge metadata without publishing validation
        if: ${{ needs.route.outputs.namespace == 'metadata' }}
        run: echo 'Metadata only; this job does not validate content or replace ci checks.'
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        name: Execute component with sanitized report
        run: python3 scripts/ci/run.py "$CI_COMPONENT"
        env:
          CI_COMPONENT: ${{ matrix.component }}
          CI_BASE: ${{ github.event.before || '58c7b095be237b526d489152a0eab387da3d8d5d' }}
      - if: ${{ always() && needs.route.outputs.namespace != 'metadata' }}
        name: Final cleanup of this job's registered resources
        run: python3 scripts/ci/cleanup.py
      - if: ${{ always() && needs.route.outputs.namespace != 'metadata' }}
        name: Upload allowlisted evidence, including failures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: tmp/ci-export/${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 14
  evidence:
    name: ${{ needs.route.outputs.namespace || 'ci' }}/evidence
    needs: [route, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful event routing
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          CI_NAMESPACE: ${{ needs.route.outputs.namespace }}
        run: python3 -c "import os; assert os.environ['ROUTE_RESULT'] == 'success' and os.environ['CI_NAMESPACE'] in ('ci', 'metadata')"
      - name: Acknowledge metadata without publishing validation
        if: ${{ needs.route.outputs.namespace == 'metadata' }}
        run: echo 'Metadata only; this job does not validate content or replace ci checks.'
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: tmp/download
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        name: Require every component artifact
        run: |
          mkdir -p tmp/ci-download
          for job in docs backend-unit frontend postgres browser; do
            mv "tmp/download/ci-$job-$RUN-$ATTEMPT-$SHA" "tmp/ci-download/$job"
          done
          python3 scripts/ci/evidence.py evidence
        env:
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          CI_BASE: ${{ github.event.before || '58c7b095be237b526d489152a0eab387da3d8d5d' }}
      - if: ${{ always() && needs.route.outputs.namespace != 'metadata' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: tmp/ci-export/evidence/
          if-no-files-found: error
          retention-days: 14
  required:
    name: ${{ needs.route.outputs.namespace || 'ci' }}/required
    needs: [route, checks, evidence]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful event routing
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          CI_NAMESPACE: ${{ needs.route.outputs.namespace }}
        run: python3 -c "import os; assert os.environ['ROUTE_RESULT'] == 'success' and os.environ['CI_NAMESPACE'] in ('ci', 'metadata')"
      - name: Acknowledge metadata without publishing validation
        if: ${{ needs.route.outputs.namespace == 'metadata' }}
        run: echo 'Metadata only; this job does not validate content or replace ci checks.'
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: tmp/download
      - if: ${{ needs.route.outputs.namespace != 'metadata' }}
        name: Reject failure, cancellation, omission and incomplete evidence
        run: |
          mkdir -p tmp/ci-download
          for job in docs backend-unit frontend postgres browser; do
            mv "tmp/download/ci-$job-$RUN-$ATTEMPT-$SHA" "tmp/ci-download/$job"
          done
          mv "tmp/download/ci-results-$RUN-$ATTEMPT-$SHA" tmp/ci-download/evidence
          python3 scripts/ci/evidence.py required
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          CI_BASE: ${{ github.event.before || '58c7b095be237b526d489152a0eab387da3d8d5d' }}
