name: CI explicit qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    name: qualification/fault-${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scenario: [test, lint, build, optin, artifact, docs, sensitive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - run: python3 scripts/ci/negative.py fixture "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: negative-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: tmp/ci-export/negative-${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 14
  omitted:
    name: qualification/intentional-skip
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: exit 0
  isolation:
    name: qualification/isolation-${{ matrix.slot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        slot: [one, two]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/negative.py isolation
        env:
          CI_SLOT: ${{ matrix.slot }}
      - run: python3 scripts/ci/cleanup.py
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolation-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: tmp/ci-export/isolation-${{ matrix.slot }}/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: qualification/gate-must-reject
    needs: [fixtures, omitted, isolation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/negative.py gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
  observe:
    name: qualification/verify-rejections
    needs: [fixtures, omitted, gate, isolation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: tmp/negative-download
          pattern: "*-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
      - run: python3 scripts/ci/negative.py observe
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: tmp/ci-export/qualification/
          retention-days: 14
          if-no-files-found: error
